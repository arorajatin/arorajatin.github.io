<!doctype html>
<meta charset="utf-8">
<!-- Driven by scripts/dither.mjs. Renders a 1-bit Atkinson-dithered sprite sheet and prints it as a data URL. -->
<script>
const q = new URLSearchParams(location.search);
const w = Number(q.get("w")), h = Number(q.get("h"));
const frames = Number(q.get("frames") || 1);
const jitter = Number(q.get("jitter") || 0.06);
const gamma = Number(q.get("gamma") || 0.8);
const sharp = Number(q.get("sharp") || 1.2);
const vig = q.get("vig") ? q.get("vig").split(",").map(Number) : null;
let seed = 7; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function emit(id, canvas) {
  const pre = document.createElement("pre"); pre.id = id; pre.textContent = canvas.toDataURL("image/png"); document.body.append(pre);
}

const img = new Image();
img.onerror = () => { document.body.append(Object.assign(document.createElement("pre"), { id: "error", textContent: "could not load " + img.src })); };
img.onload = () => {
  const crop = q.get("crop") ? q.get("crop").split(",").map(Number) : null;
  const [cx, cy, cw, ch] = crop
    ? (crop.length === 3 ? [crop[0], crop[1], crop[2], crop[2]] : crop)
    : centreCrop(img.naturalWidth, img.naturalHeight, w / h);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, cx, cy, cw, ch, 0, 0, w, h);
  const src = ctx.getImageData(0, 0, w, h).data;
  let gray = [];
  for (let i = 0; i < w * h; i++) gray.push((0.299 * src[i*4] + 0.587 * src[i*4+1] + 0.114 * src[i*4+2]) / 255);
  const sorted = [...gray].sort((a, b) => a - b);
  const lo = sorted[Math.floor(w * h * 0.03)], hi = sorted[Math.floor(w * h * 0.97)];
  const blur = gray.map((_, i) => {
    const x = i % w, y = Math.floor(i / w); let s = 0, k = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue; s += gray[yy * w + xx]; k++;
    }
    return s / k;
  });
  gray = gray.map((g, i) => {
    let v = Math.min(1, Math.max(0, (g - lo) / (hi - lo)));
    v = Math.min(1, Math.max(0, v + sharp * (g - blur[i]) / (hi - lo)));
    v = Math.pow(v, gamma);
    if (!vig) return v;
    const x = (i % w) / w - 0.5, y = Math.floor(i / w) / h - 0.47;
    return v + (1 - v) * smooth(vig[0], vig[1], Math.hypot(x / 0.9, y));
  });

  const sheet = document.createElement("canvas"); sheet.width = w * frames; sheet.height = h;
  const sctx = sheet.getContext("2d"); const out = sctx.createImageData(w * frames, h);
  for (let f = 0; f < frames; f++) {
    const e = gray.map((g) => g + (rand() - 0.5) * jitter);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x, v = e[i] > 0.5 ? 1 : 0, err = (e[i] - v) / 8;
      for (const [dx, dy] of [[1,0],[2,0],[-1,1],[0,1],[1,1],[0,2]]) {
        const xx = x + dx, yy = y + dy; if (xx >= 0 && xx < w && yy < h) e[yy * w + xx] += err;
      }
      const o = (y * w * frames + f * w + x) * 4;
      out.data[o] = out.data[o+1] = out.data[o+2] = v * 255; out.data[o+3] = 255;
    }
  }
  sctx.putImageData(out, 0, 0);
  emit("sheet", sheet);

  const icon = document.createElement("canvas"); icon.width = w; icon.height = h;
  const ictx = icon.getContext("2d");
  ictx.beginPath(); ictx.ellipse(w / 2, h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); ictx.clip();
  ictx.imageSmoothingEnabled = false; ictx.drawImage(sheet, 0, 0, w, h, 0, 0, w, h);
  emit("icon", icon);
};
img.src = q.get("src");

function centreCrop(iw, ih, ratio) {
  return iw / ih > ratio
    ? [(iw - ih * ratio) / 2, 0, ih * ratio, ih]
    : [0, (ih - iw / ratio) / 2, iw, iw / ratio];
}
</script>
